<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980"><rect width="1200" height="980" fill="#edf5f0"/><g font-family="sans-serif" fill="#17392d"><text x="40" y="55" font-size="30" font-weight="bold">共同運営・共通窓口と、有料予想サイトへの紹介経路</text><rect x="30" y="90" width="1140" height="235" rx="14" fill="white"/><text x="60" y="138" font-size="27" font-weight="bold">霧島・星・小泉</text><text x="60" y="180" font-size="23">↓ 同じ3人で運営と明記</text><text x="60" y="230" font-size="26">競輪／ボートレースマンション</text><text x="660" y="230" font-size="23">競輪版 → リオ ka=2・修羅 ka=2</text><path d="M535 220 H630" stroke="#007458" stroke-width="3"/><text x="60" y="285" font-size="23">小泉・星のLINE → @430jevgp</text><rect x="30" y="350" width="1140" height="235" rx="14" fill="white"/><text x="60" y="398" font-size="27" font-weight="bold">ジェシー・キャメロン</text><text x="60" y="440" font-size="23">↓ 共同運営と明記</text><text x="60" y="490" font-size="26">競輪の案内係</text><text x="660" y="490" font-size="23">リオ → ka=6</text><path d="M535 480 H630" stroke="#007458" stroke-width="3"/><text x="60" y="545" font-size="23">2つのLINE → @095eiimm</text><rect x="30" y="610" width="1140" height="235" rx="14" fill="white"/><text x="60" y="658" font-size="27" font-weight="bold">綾小路・カレン・くれあちゃん</text><text x="60" y="700" font-size="23">↓ 3人で運営と明記</text><text x="60" y="750" font-size="26">Keirin Voyage</text><text x="660" y="750" font-size="23">修羅 → ka=4</text><path d="M535 740 H630" stroke="#007458" stroke-width="3"/><text x="60" y="805" font-size="23">広告（PR）を含むと開示</text><text x="40" y="910" font-size="23">線は公開ページの説明・リンクだけを示す。法人・代理店・雇用契約は未確認。</text><text x="40" y="950" font-size="20">確認：2026年11月23日 ／ 別グループ同士の共通運営を示すものではありません</text></g></svg>