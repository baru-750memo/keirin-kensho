<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img"><title>万車師ケン名義とコロクリの公開導線</title><rect width="1000" height="720" fill="#f1f7f4"/><g font-family="sans-serif" fill="#16382e"><text x="45" y="65" font-size="31" font-weight="700">万車師ケン名義とコロクリの公開導線</text><text x="45" y="103" font-size="19">公開ページの記載・リンクを照合／2026年11月25日</text><rect x="35" y="145" width="295" height="64" rx="12" fill="white"/><rect x="645" y="145" width="320" height="64" rx="12" fill="white"/><text x="55" y="185" font-size="21" font-weight="700">競輪コロクリ</text><path d="M340 185H625l-10 -6m10 6l-10 6" stroke="#128366" stroke-width="3" fill="none"/><text x="345" y="168" font-size="17">記事内で紹介・発言を掲載</text><text x="660" y="185" font-size="21" font-weight="700">万車師ケン名義</text><rect x="35" y="245" width="295" height="64" rx="12" fill="white"/><rect x="645" y="245" width="320" height="64" rx="12" fill="white"/><text x="55" y="285" font-size="21" font-weight="700">記事のSNSアイコン</text><path d="M340 285H625l-10 -6m10 6l-10 6" stroke="#128366" stroke-width="3" fill="none"/><text x="345" y="268" font-size="17">リンク先のアカウント名</text><text x="660" y="285" font-size="21" font-weight="700">mansyashi_ken_01</text><rect x="35" y="345" width="295" height="64" rx="12" fill="white"/><rect x="645" y="345" width="320" height="64" rx="12" fill="white"/><text x="55" y="385" font-size="21" font-weight="700">記事のLINEリンク</text><path d="M340 385H625l-10 -6m10 6l-10 6" stroke="#128366" stroke-width="3" fill="none"/><text x="345" y="368" font-size="17">短縮URLの転送先</text><text x="660" y="385" font-size="21" font-weight="700">@066cxjzu</text><rect x="35" y="445" width="295" height="64" rx="12" fill="white"/><rect x="645" y="445" width="320" height="64" rx="12" fill="white"/><text x="55" y="485" font-size="21" font-weight="700">ランキング記事</text><path d="M340 485H625l-10 -6m10 6l-10 6" stroke="#128366" stroke-width="3" fill="none"/><text x="345" y="468" font-size="17">4サイトへの紹介リンク</text><text x="660" y="485" font-size="21" font-weight="700">オリンピア／宝箱 ほか</text><text x="45" y="585" font-size="19">確認したのは掲載名義と案内経路。法人・代理店・雇用関係は未確認。</text><text x="45" y="621" font-size="19">他の「万車師ケン」アカウントと、同じ人物だとは確定していません。</text><text x="45" y="657" font-size="19">「競艇コロクリへ」のリンク先は現在、英語のアート紹介ページです。</text></g></svg>