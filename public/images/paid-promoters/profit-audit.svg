<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f8f2ed"/><g font-family="sans-serif"><text x="60" y="95" font-size="40" font-weight="bold" fill="#24352f">その「利益」、掲載表から再現できますか。</text><rect x="50" y="155" width="530" height="300" rx="18" fill="#fff"/><rect x="620" y="155" width="530" height="300" rx="18" fill="#183e32"/><g fill="#8d3026"><text x="85" y="225" font-size="30">記事が説明する合計利益</text><text x="85" y="345" font-size="72" font-weight="bold">128,300円</text></g><g fill="white"><text x="655" y="225" font-size="30">掲載13行から計算した差額</text><text x="655" y="345" font-size="72" font-weight="bold">85,400円</text></g><g fill="#24352f"><text x="60" y="525" font-size="34">150,400円 − 65,000円 ＝ 85,400円</text><text x="60" y="585" font-size="27">差は42,900円。払戻・費用・利益を分けて照合。</text><text x="60" y="650" font-size="23">競輪の案内係・リオ紹介記事の無料予想表／2026年11月23日確認</text></g></g></svg>