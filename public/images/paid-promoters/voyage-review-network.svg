<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img"><title>紹介メディア自身も、同じ販売先へ案内</title><rect width="1000" height="720" fill="#f1f7f4"/><g font-family="sans-serif" fill="#16382e"><text x="45" y="65" font-size="31" font-weight="700">紹介メディア自身も、同じ販売先へ案内</text><text x="45" y="103" font-size="19">公開ページの記載・リンクを照合／2026年11月25日</text><rect x="35" y="145" width="295" height="64" rx="12" fill="white"/><rect x="645" y="145" width="320" height="64" rx="12" fill="white"/><text x="55" y="185" font-size="21" font-weight="700">Keirin Voyage</text><path d="M340 185H625l-10 -6m10 6l-10 6" stroke="#128366" stroke-width="3" fill="none"/><text x="345" y="168" font-size="17">本人媒体が共同運営を説明</text><text x="660" y="185" font-size="21" font-weight="700">綾小路・カレン・くれあ</text><rect x="35" y="245" width="295" height="64" rx="12" fill="white"/><rect x="645" y="245" width="320" height="64" rx="12" fill="white"/><text x="55" y="285" font-size="21" font-weight="700">Voyageのルナ紹介記事</text><path d="M340 285H625l-10 -6m10 6l-10 6" stroke="#128366" stroke-width="3" fill="none"/><text x="345" y="268" font-size="17">販売先への直接リンク</text><text x="660" y="285" font-size="21" font-weight="700">clear-racer.com</text><rect x="35" y="345" width="295" height="64" rx="12" fill="white"/><rect x="645" y="345" width="320" height="64" rx="12" fill="white"/><text x="55" y="385" font-size="21" font-weight="700">ウサ木ミミの紹介ページ</text><path d="M340 385H625l-10 -6m10 6l-10 6" stroke="#128366" stroke-width="3" fill="none"/><text x="345" y="368" font-size="17">販売先への直接リンク</text><text x="660" y="385" font-size="21" font-weight="700">clear-racer.com</text><rect x="35" y="445" width="295" height="64" rx="12" fill="white"/><rect x="645" y="445" width="320" height="64" rx="12" fill="white"/><text x="55" y="485" font-size="21" font-weight="700">Voyageのみゆ紹介記事</text><path d="M340 485H625l-10 -6m10 6l-10 6" stroke="#128366" stroke-width="3" fill="none"/><text x="345" y="468" font-size="17">結論欄の別名を確認</text><text x="660" y="485" font-size="21" font-weight="700">「ホーク＠鷹の目」</text><text x="45" y="585" font-size="19">緑の矢印は各ラベルの内容だけを示します。共通代理店の証明ではありません。</text><text x="45" y="621" font-size="19">ルナ本人→販売先の線は、本人の公開案内を未確認のため描いていません。</text><text x="45" y="657" font-size="19">結論欄の名前の不一致は、みゆとホークが同一人物という意味ではありません。</text></g></svg>