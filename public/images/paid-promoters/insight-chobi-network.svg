<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="870" viewBox="0 0 1000 870" role="img"><title>インサイトとチョビの紹介経路。共通所属は未確認</title><rect width="1000" height="870" fill="#eff6f2"/><g font-family="sans-serif" fill="#183c32"><text x="40" y="58" font-size="31" font-weight="700">インサイト・チョビの紹介経路を追加照合</text><text x="40" y="96" font-size="20">2026年11月25日／運営の説明・相談窓口・販売先を分けて確認</text><rect x="35" y="130" width="450" height="350" rx="18" fill="white"/><rect x="515" y="130" width="450" height="350" rx="18" fill="white"/><text x="60" y="175" font-size="28" font-weight="700">競輪インサイト</text><text x="540" y="175" font-size="28" font-weight="700">競輪チョビ</text><text x="60" y="220" font-size="21">二宮澪名義で運営・発信を説明</text><text x="540" y="220" font-size="21">リオ・修羅の記事から相談を案内</text><text x="60" y="270" font-size="20">lin.ee/WbpLOQe</text><text x="540" y="265" font-size="20">lin.ee/DavbdXb</text><text x="540" y="300" font-size="20">lin.ee/sWmZBpf</text><path d="M260 285V330m-7 -10l7 10 7 -10M740 315V345m-7 -10l7 10 7 -10" stroke="#168568" stroke-width="3" fill="none"/><text x="60" y="370" font-size="24" font-weight="700">LINE @523tzpzk</text><text x="540" y="390" font-size="24" font-weight="700">LINE @749epztw</text><text x="60" y="435" font-size="19">紹介記事のリンクを下へ照合</text><text x="540" y="435" font-size="19">2つの短縮URLは同じ窓口へ</text><path d="M160 480V535H250V575M400 480V520H740V575M630 480V550H250M870 480V535H740" stroke="#168568" stroke-width="3" fill="none"/><text x="45" y="563" font-size="17">販売先へのリンク</text><rect x="35" y="580" width="450" height="105" rx="14" fill="#193d32"/><rect x="515" y="580" width="450" height="105" rx="14" fill="#193d32"/><g fill="white"><text x="60" y="620" font-size="26" font-weight="700">競輪リオ</text><text x="60" y="655" font-size="20">yoso-site.com</text><text x="540" y="620" font-size="26" font-weight="700">競輪修羅</text><text x="540" y="655" font-size="20">keirin-racesite.com</text></g><text x="40" y="735" font-size="21" font-weight="700">共通する販売先を確認。媒体間の共通会社・代理店は未確認。</text><text x="40" y="776" font-size="19">URLの ka 値が違っても、同じでも、契約・報酬・所有関係は確定できません。</text><text x="40" y="812" font-size="19">掲載名義と公開窓口の確認であり、個人の実在性・雇用契約の認定ではありません。</text></g></svg>