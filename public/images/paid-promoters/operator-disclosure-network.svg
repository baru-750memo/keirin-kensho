<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220"><title>3媒体の公開運営名義と紹介経路</title><rect width="1000" height="1220" fill="#edf4f1"/><g font-family="sans-serif" fill="#153c34"><text x="50" y="60" font-size="29" font-weight="700">媒体名が別でも、責任者名・Xは共通</text><text x="50" y="95" font-size="18">2026年11月25日確認／公開表記とリンクのみを図示</text><rect x="50" y="140" width="370" height="85" rx="14" fill="white"/><text x="72" y="175" font-size="23" font-weight="700">みんちゃり（競輪）</text><text x="72" y="205" font-size="18">各媒体の運営ページに掲載</text><path d="M420 182 H490 V297 H550" fill="none" stroke="#16856c" stroke-width="3"/><rect x="50" y="255" width="370" height="85" rx="14" fill="white"/><text x="72" y="290" font-size="23" font-weight="700">みんけい（競馬）</text><text x="72" y="320" font-size="18">各媒体の運営ページに掲載</text><path d="M420 297 H490 V297 H550" fill="none" stroke="#16856c" stroke-width="3"/><rect x="50" y="370" width="370" height="85" rx="14" fill="white"/><text x="72" y="405" font-size="23" font-weight="700">みんふね（競艇）</text><text x="72" y="435" font-size="18">各媒体の運営ページに掲載</text><path d="M420 412 H490 V297 H550" fill="none" stroke="#16856c" stroke-width="3"/><rect x="550" y="225" width="400" height="145" rx="14" fill="#153c34"/><g fill="white"><text x="575" y="265" font-size="23">責任者名：アトム</text><text x="575" y="305" font-size="23">公式X：mingambleX</text><text x="575" y="343" font-size="17">法人・実名・契約までは未確認</text></g><rect x="50" y="495" width="900" height="155" rx="14" fill="white"/><text x="75" y="535" font-size="23" font-weight="700">追加で照合したリンク</text><text x="75" y="578" font-size="21">みんちゃり運営本文 → みんけい問い合わせ</text><text x="75" y="617" font-size="21">みんちゃりSHIVA記事 → keirin-shiva.com</text><rect x="50" y="690" width="900" height="155" rx="14" fill="#fff6df"/><text x="75" y="733" font-size="23" font-weight="700">所属は未確認：この3媒体へ線をつながない</text><text x="75" y="776" font-size="22">めろ・てぃな・るみなす・竜さん</text><text x="75" y="815" font-size="22">れお・ばぶ・まよたん</text><rect x="50" y="880" width="900" height="285" rx="14" fill="white"/><text x="75" y="923" font-size="25" font-weight="700">追加確認：まよたん名義の共通窓口</text><text x="75" y="972" font-size="22">X @Tensyou2_Win ─┐</text><text x="75" y="1015" font-size="22">X @umamero_cha  ─┴→ lin.ee/odwLoFq</text><text x="75" y="1062" font-size="23" font-weight="700">転送先：LINE @095mmpmh</text><text x="75" y="1110" font-size="19">同一人物・所属法人・代理店・販売先は未確認</text><text x="75" y="1140" font-size="19">上の3媒体との所属関係を示す線ではない</text></g></svg>