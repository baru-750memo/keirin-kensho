<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f1e9db"/><g font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif"><text x="64" y="70" font-size="20" fill="#47716b" font-weight="600">CASH FLOW / 03</text><text x="64" y="135" font-size="43" fill="#183d39" font-weight="600">途中の払戻を、二重に数えない。</text><rect x="70" y="240" width="310" height="235" rx="16" fill="#ffffff"/><text x="95" y="290" font-size="24" fill="#ac743e" font-weight="600">01</text><text x="95" y="350" font-size="28" fill="#183d39" font-weight="600">初回投票</text><text x="95" y="420" font-size="40" fill="#183d39" font-weight="600">10,000円</text><text x="390" y="365" font-size="38" fill="#183d39" font-weight="600">→</text><rect x="440" y="240" width="310" height="235" rx="16" fill="#ffffff"/><text x="465" y="290" font-size="24" fill="#ac743e" font-weight="600">02</text><text x="465" y="350" font-size="28" fill="#183d39" font-weight="600">再投票</text><text x="465" y="420" font-size="40" fill="#183d39" font-weight="600">30,000円</text><text x="760" y="365" font-size="38" fill="#183d39" font-weight="600">→</text><rect x="810" y="240" width="310" height="235" rx="16" fill="#ffffff"/><text x="835" y="290" font-size="24" fill="#ac743e" font-weight="600">03</text><text x="835" y="350" font-size="28" fill="#183d39" font-weight="600">最終払戻</text><text x="835" y="420" font-size="40" fill="#183d39" font-weight="600">60,000円</text><rect x="70" y="510" width="1050" height="70" rx="16" fill="#234e4c"/><text x="100" y="556" font-size="27" fill="#fff" font-weight="600">途中の払戻を次へ ／ 初期資金15,000円 → 収支45,000円</text><text x="64" y="653" font-size="20" fill="#526c68" font-weight="400">仮例：情報料5,000円、途中の残金・追加資金なし</text></g></svg>