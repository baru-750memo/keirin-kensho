<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#eef1ed"/><g font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif"><text x="64" y="70" font-size="20" fill="#47716b" font-weight="600">NEWS / KOKURA</text><text x="64" y="135" font-size="43" fill="#183d39" font-weight="600">2つのGI、異なる最終日。</text><text x="70" y="240" font-size="25" fill="#183d39" font-weight="600">2026 NOVEMBER</text><text x="365" y="240" font-size="40" fill="#183d39" font-weight="600">18</text><text x="495" y="240" font-size="40" fill="#183d39" font-weight="600">19</text><text x="625" y="240" font-size="40" fill="#183d39" font-weight="600">20</text><text x="755" y="240" font-size="40" fill="#183d39" font-weight="600">21</text><text x="885" y="240" font-size="40" fill="#183d39" font-weight="600">22</text><text x="1015" y="240" font-size="40" fill="#183d39" font-weight="600">23</text><text x="70" y="340" font-size="32" fill="#183d39" font-weight="600">競輪祭</text><rect x="340" y="280" width="790" height="96" rx="16" fill="#177369"/><text x="370" y="341" font-size="34" fill="#fff" font-weight="600">18日 → 23日 ／ 6日間</text><text x="70" y="475" font-size="30" fill="#183d39" font-weight="600">女子王座戦</text><rect x="340" y="415" width="390" height="96" rx="16" fill="#a64a6c"/><text x="370" y="475" font-size="31" fill="#fff" font-weight="600">18日 → 20日</text><text x="64" y="653" font-size="20" fill="#526c68" font-weight="400">2026年11月18日の公式開幕案内を基に作成／結果を示す図ではありません</text></g></svg>