<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fbf3dd"/><g font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif"><text x="64" y="70" font-size="20" fill="#47716b" font-weight="600">WATCH / 05</text><text x="64" y="135" font-size="43" fill="#183d39" font-weight="600">観戦は、3つの場面で見る。</text><rect x="70" y="250" width="310" height="310" rx="16" fill="#fff"/><circle cx="225" cy="325" r="42" fill="#d89a43"/><text x="212" y="340" font-size="40" fill="#fff" font-weight="600">1</text><text x="105" y="425" font-size="38" fill="#183d39" font-weight="600">レース前</text><text x="98" y="487" font-size="25" fill="#183d39" font-weight="600">開催場・レース番号</text><rect x="440" y="250" width="310" height="310" rx="16" fill="#fff"/><circle cx="595" cy="325" r="42" fill="#d89a43"/><text x="582" y="340" font-size="40" fill="#fff" font-weight="600">2</text><text x="475" y="425" font-size="38" fill="#183d39" font-weight="600">競走中</text><text x="468" y="487" font-size="25" fill="#183d39" font-weight="600">位置の変化を見る</text><rect x="810" y="250" width="310" height="310" rx="16" fill="#fff"/><circle cx="965" cy="325" r="42" fill="#d89a43"/><text x="952" y="340" font-size="40" fill="#fff" font-weight="600">3</text><text x="845" y="425" font-size="38" fill="#183d39" font-weight="600">確定後</text><text x="838" y="487" font-size="25" fill="#183d39" font-weight="600">着順・結果を確認</text><text x="64" y="653" font-size="20" fill="#526c68" font-weight="400">編集部の観戦メモ案／公式の競技規則を表す図ではありません</text></g></svg>