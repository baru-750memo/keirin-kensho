<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#edf2f8"/><g font-family="Arial, Noto Sans JP, Yu Gothic, sans-serif"><text x="64" y="70" font-size="20" fill="#47716b" font-weight="600">SCREEN / 06</text><text x="64" y="135" font-size="43" fill="#183d39" font-weight="600">車番・点数・枚数を分ける。</text><rect x="75" y="220" width="470" height="360" rx="16" fill="#fff"/><text x="110" y="280" font-size="29" fill="#183d39" font-weight="600">入力する数字</text><circle cx="155" cy="375" r="46" fill="#2b2b2b"/><text x="141" y="392" font-size="45" fill="#fff" font-weight="600">2</text><circle cx="295" cy="375" r="46" fill="#cf3b40"/><text x="281" y="392" font-size="45" fill="#fff" font-weight="600">3</text><circle cx="435" cy="375" r="46" fill="#2e73a0"/><text x="421" y="392" font-size="45" fill="#fff" font-weight="600">4</text><text x="110" y="493" font-size="29" fill="#183d39" font-weight="600">車番 → 組み合わせ</text><text x="570" y="390" font-size="46" fill="#183d39" font-weight="600">→</text><rect x="650" y="220" width="470" height="360" rx="16" fill="#205468"/><text x="685" y="280" font-size="29" fill="#fff" font-weight="600">確認する数字</text><text x="685" y="370" font-size="34" fill="#fff" font-weight="600">買い目の総数</text><text x="685" y="440" font-size="34" fill="#fff" font-weight="600">購入枚数</text><text x="685" y="510" font-size="34" fill="#fff" font-weight="600">合計ポイント</text><text x="64" y="653" font-size="20" fill="#526c68" font-weight="400">編集部作成の確認順／操作画面ではありません。公式図は本文に掲載</text></g></svg>